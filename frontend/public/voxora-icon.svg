<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090b0e" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#a3e635" stroke-opacity="0.3" stroke-width="2" />
  <!-- Waveform / Sound bars styled as an abstract modern 'V' -->
  <line x1="24" y1="40" x2="24" y2="60" stroke="#a3e635" stroke-width="6" stroke-linecap="round" />
  <line x1="37" y1="30" x2="37" y2="70" stroke="#bef264" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="url(#limeGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <line x1="63" y1="32" x2="63" y2="68" stroke="#bef264" stroke-width="6" stroke-linecap="round" />
  <line x1="76" y1="42" x2="76" y2="58" stroke="#a3e635" stroke-width="6" stroke-linecap="round" />
</svg>
